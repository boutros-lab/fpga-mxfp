# Technology Setup
# Technology used is ASAP7
vlsi.core.technology: "hammer.technology.asap7"
vlsi.core.node: 28
# Specify dir with ASAP7 Calibre deck tarball
technology.asap7.tarball_dir: "/shared/asap7"
technology.asap7.pdk_install_dir: "/shared/asap7/asap7_pdk_r1p7"

vlsi.core.max_threads: 12

# General Hammer Inputs

cadence.CDS_LIC_FILE: "6055@cadpass2.eng.uwaterloo.ca:6055@cadpass1.eng.uwaterloo.ca:7055@cadpass1.eng.uwaterloo.ca:7055@cadpass2.eng.uwaterloo.ca"


# Hammer will auto-generate a CPF for simple power designs; see hammer/src/hammer-vlsi/defaults.yml for more info
vlsi.inputs.power_spec_mode: "auto"
vlsi.inputs.power_spec_type: "cpf"

# Specify clock signals
vlsi.inputs.clocks: [
  {name: "clk", period: "1ns", uncertainty: "0.1ns"}
]

# Synthesis options
vlsi.core.synthesis_tool: "hammer.synthesis.genus"
synthesis.genus.genus_bin: "genus"
synthesis.genus.genus_bin_meta: "lazysubst"
synthesis.genus.version: "20.10.000_lnx86"
synthesis.inputs.input_files: [
#  "/home/aelsousy/hammer-starter/adder.vhd",
#  "/home/aelsousy/hammer-starter/accumulator.v"
   "rtl/pkg_aitb.sv",
   "rtl/aitb_top.sv",
   "rtl/aitb_wrapper.sv",
#   "rtl/altera_fp_aitb.sv",
   "rtl/dot.sv",
   "rtl/fix2fp32.sv",
   "rtl/in_reg_bank.sv",
   "rtl/input_preparation.sv",
   "rtl/mxfp_dot.sv",
   "rtl/normalizer.sv",
   "rtl/pipeline.sv",
   "rtl/ieee_fp32_add.vhd"

]
synthesis.inputs.top_module: "aitb_top"
synthesis.clock_gating_mode: "empty"
synthesis.flatten_hierarchy: False
  
# PaR options
vlsi.core.par_tool: "hammer.par.innovus"
par.innovus.innovus_bin: "innovus"
par.innovus.innovus_bin_meta: "lazysubst"
par.innovus.version: "21.12.000_lnx86"
technology.core.tap_cell_rail_reference: "TAPCELL_ASAP7_75t_L"
  
# Placement Constraints
# For ASAP7, all numbers must be 4x larger than final GDS
vlsi.inputs.placement_constraints:
  - path: "aitb_top"
    type: toplevel
    x: 0
    y: 0
    core_utilization: 0.9
    width: 1000
    height: 1000
    margins:
      left: 0
      right: 0
      top: 0
      bottom: 0

# Pin placement constraints
vlsi.inputs.pin_mode: "generated"
vlsi.inputs.pin.generate_mode: "full_auto"
vlsi.inputs.pin.assignments: [
  {pins: "*", layers: ["M5", "M7"], side: "bottom"}
]

